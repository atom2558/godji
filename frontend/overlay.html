<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>AI Godji Screen HUD Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #hudCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }
    #subtitleBox {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #ef4444;
      border-radius: 12px;
      padding: 14px 28px;
      color: #ffffff;
      font-size: 20px;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(239, 68, 68, 0.4);
      backdrop-filter: blur(8px);
      max-width: 80%;
      pointer-events: none;
      transition: all 0.3s ease;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="hudCanvas"></canvas>
  <div id="subtitleBox">🐉 subtitle ของ ai</div>

  <script src="overlay.js"></script>
</body>
</html>
